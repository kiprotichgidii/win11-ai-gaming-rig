services:

  # --- LLM Engine (CPU mode - no GPU reservation) ---
  ollama:
    image: ollama/ollama:latest
    pull_policy: if_not_present
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_data:/root/.ollama

  # --- Model Auto-Loader (runs once to pull chat models into Ollama) ---
  ollama-init:
    image: ollama/ollama:latest
    pull_policy: if_not_present
    container_name: ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        while ! ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull llama3.1:8b
        ollama pull qwen2.5-coder:7b
        echo "Models successfully loaded into Ollama!"

  # --- Chat Interface ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: if_not_present
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama

  # --- Image / Video Generation (CPU mode - no GPU reservation) ---
  comfyui:
    image: yanwk/comfyui-boot:cu130-slim-v2
    pull_policy: if_not_present
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - comfyui_storage:/root/ComfyUI

volumes:
  ollama_data:
  open_webui_data:
  comfyui_storage:
